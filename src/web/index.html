<!doctype html>
<html lang="pt-BR" data-theme="cartucho" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0e17" />
    <!-- Tema salvo neste aparelho (src/web/lib/theme.ts), aplicado antes da primeira pintura. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("zerometro:theme") || "null");
        if (t && /^[a-z-]+$/.test(t.id) && /^(dark|light)$/.test(t.mode)) {
          var r = document.documentElement;
          r.dataset.theme = t.id;
          r.dataset.mode = t.mode;
          if (t.themeColor)
            document.querySelector('meta[name="theme-color"]').content = t.themeColor;
          if (t.fontsHref && t.fontsHref.indexOf("https://fonts.googleapis.com/") === 0) {
            var l = document.createElement("link");
            l.id = "theme-fonts";
            l.rel = "stylesheet";
            l.href = t.fontsHref;
            document.head.appendChild(l);
          }
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Quanto falta pra zerar? Backlog de jogos, sessões, ofensiva e estatísticas."
    />
    <meta name="apple-mobile-web-app-title" content="Zerômetro" />
    <title>Zerômetro</title>
    <!-- Manifest pelo bundler (ganha hash); os ícones dele são absolutos, servidos por src/server/static.ts. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
