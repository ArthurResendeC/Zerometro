#:schema https://mise.jdx.dev/schema/mise.json
# Fonte única de ferramentas, variáveis de ambiente e tarefas do projeto.
# Uso: `mise install` e depois `mise run <tarefa>` (ou `mise tasks` para listar).

[tools]
bun = "1.4.4"
node = "lts" # usado pelo oxfmt (backend npm) e pelo npx (ex.: MCP Inspector)
oxlint = "1.94.0"
oxfmt = "0.79.0"
railway = "5.71.0" # CLI da Railway (IaC exige >= 5.42.1)

[env]
# Padrões; sobrescreva no .env (não versionado)
DATABASE_PATH = "{{config_root}}/data/zerometro.db" # absoluto: o `start` roda de dentro de dist/
TZ = "America/Sao_Paulo"
PORT = "3000"
_.file = { path = ".env", redact = true }

[tasks.install]
description = "Instala as dependências"
run = "bun install"

[tasks.dev]
description = "Desenvolvimento: servidor com HMR + watch das rotas, em paralelo"
depends = ["dev:server", "routes:watch"]

[tasks."dev:server"]
description = "Servidor de desenvolvimento (API + MCP + frontend com HMR)"
depends = ["routes:gen", "db:migrate"]
run = "bun --hot src/server/index.ts"

[tasks."routes:gen"]
description = "Gera a árvore de rotas do TanStack Router"
run = "bunx --bun tsr generate"

[tasks."routes:watch"]
description = "Regenera a árvore de rotas ao alterar src/web/routes"
run = "bunx --bun tsr watch"

[tasks.build]
description = "Build de produção em ./dist"
depends = ["routes:gen"]
run = "bun scripts/build.ts"

[tasks.start]
description = "Roda o build de produção"
env = { NODE_ENV = "production" }
# O Bun resolve os assets do HTML import a partir do cwd, então rodamos de dentro de dist/.
dir = "{{config_root}}/dist"
run = "bun index.js"

[tasks.icons]
description = "Gera os ícones PNG do app (PWA e iOS) a partir da chama em pixel art"
run = "bun scripts/generate-icons.ts"

[tasks."docker:build"]
description = "Builda a imagem de produção (a mesma que a Railway usa)"
run = "docker build -t zerometro:local ."

[tasks."docker:run"]
description = "Roda a imagem como na Railway: PORT injetada, volume em /data e segredos do .env"
depends = ["docker:build"]
# Segredos passados por nome (-e VAR), sem valor na linha de comando. Porta 3000 = redirect do Google em dev.
run = """
docker rm -f zerometro-local >/dev/null 2>&1 || true
docker run --rm --name zerometro-local -p 3000:8080 -e PORT=8080 \
  -v zerometro-data-local:/data -e BETTER_AUTH_URL=http://localhost:3000 \
  -e BETTER_AUTH_SECRET -e GOOGLE_CLIENT_ID -e GOOGLE_CLIENT_SECRET \
  -e IGDB_CLIENT_ID -e IGDB_CLIENT_SECRET -e ALLOWED_EMAILS \
  zerometro:local
"""

[tasks."deploy:plan"]
description = "Mostra o que mudaria na Railway (.railway/railway.ts), sem aplicar"
run = "railway config plan"

[tasks."deploy:apply"]
description = "Aplica .railway/railway.ts no projeto da Railway vinculado (pede confirmação)"
run = "railway config apply --yes"

[tasks."db:generate"]
description = "Gera uma migration a partir do schema do Drizzle"
run = "bunx --bun drizzle-kit generate"

[tasks."db:migrate"]
description = "Aplica as migrations pendentes"
run = "bun src/server/db/migrate.ts"

[tasks."db:studio"]
description = "Abre o Drizzle Studio"
run = "bunx --bun drizzle-kit studio"

[tasks.typecheck]
description = "Checagem de tipos"
depends = ["routes:gen"]
run = "bunx tsc --noEmit"

[tasks.test]
description = "Testes"
run = "bun test"

[tasks.lint]
description = "Lint com oxlint"
run = "oxlint --deny-warnings"

[tasks."lint:fix"]
description = "Lint com correções automáticas"
run = "oxlint --fix"

[tasks.fmt]
description = "Formata o código com oxfmt"
run = "oxfmt"

[tasks."fmt:check"]
description = "Verifica a formatação sem alterar arquivos"
run = "oxfmt --check"

[tasks.check]
description = "Formatação + lint + typecheck + testes"
depends = ["fmt:check", "lint", "typecheck", "test"]

[tasks."mcp:inspect"]
description = "Abre o MCP Inspector"
run = "npx @modelcontextprotocol/inspector"

[tasks."igdb:smoke"]
description = "Testa busca e tempo para zerar no IGDB real (ex.: mise run igdb:smoke ocarina of time)"
run = "bun scripts/igdb-smoke.ts"

[tasks."demo:capture"]
description = "Congela no demo as páginas de jogo do IGDB real (scripts/demo-game-pages.json); rodar antes do demo:seed quando quiser dados novos"
run = "bun scripts/capture-demo-games.ts"

[tasks."demo:seed"]
description = "Recria o banco de demonstração (data/demo.db) com dados de exemplo para prints"
env = { DATABASE_PATH = "{{config_root}}/data/demo.db" }
run = "bun scripts/seed-demo.ts"

[tasks.demo]
description = "Servidor de desenvolvimento com o banco de demonstração recém-criado"
depends = ["routes:gen", "demo:seed"]
env = { DATABASE_PATH = "{{config_root}}/data/demo.db" }
run = "bun --hot src/server/index.ts"
